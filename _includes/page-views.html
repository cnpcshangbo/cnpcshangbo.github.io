<span id="page-views" hidden data-page-url="{{ site.url | append: site.baseurl | append: page.url | escape }}" title="Page views{% if page.page_views_since %} since {{ page.page_views_since | date: '%B %d, %Y' }}{% endif %}. Includes repeat visits; does not measure completed reads." aria-live="polite">{% if page.read_time %}<span aria-hidden="true"> &middot; </span>{% endif %}<i class="fa fa-eye" aria-hidden="true"></i> <span data-view-count></span></span>
