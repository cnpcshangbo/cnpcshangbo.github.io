{% if page.url == "/" %}
<!-- schema.org profile for search engines and AI agents (facts mirror the CV) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfilePage",
  "@id": "{{ site.url }}/#profilepage",
  "url": "{{ site.url }}/",
  "name": "{{ site.title }}",
  "inLanguage": "en",
  "mainEntity": {
    "@type": "Person",
    "@id": "{{ site.url }}/#person",
    "name": "{{ site.author.name }}",
    "givenName": "Bo",
    "familyName": "Shang",
    "honorificSuffix": "Ph.D.",
    "jobTitle": "Postdoctoral Associate",
    "description": {{ site.description | jsonify }},
    "url": "{{ site.url }}/",
    "image": "{{ site.url }}/images/{{ site.author.avatar }}",
    "email": "mailto:{{ site.author.email }}",
    "affiliation": {
      "@type": "CollegeOrUniversity",
      "name": "University of Maryland",
      "url": "https://www.umd.edu/"
    },
    "worksFor": {
      "@type": "CollegeOrUniversity",
      "name": "University of Maryland",
      "department": [
        { "@type": "Organization", "name": "Department of Civil and Environmental Engineering" },
        { "@type": "Organization", "name": "Maryland Transportation Institute" }
      ]
    },
    "alumniOf": [
      { "@type": "CollegeOrUniversity", "name": "Northeastern University, China" }
    ],
    "knowsAbout": [
      "Physical AI",
      "Field robotics",
      "Embodied robotics",
      "LiDAR-camera perception",
      "Roadside LiDAR",
      "Intelligent transportation systems",
      "Vulnerable-road-user sensing and transportation safety",
      "Robotic infrastructure inspection",
      "Unmanned aerial vehicles",
      "Visual servoing",
      "GPS-denied navigation",
      "Geospatial AI"
    ],
    "sameAs": [
      {{ site.author.googlescholar | jsonify }},
      {{ site.author.orcid | jsonify }},
      {{ site.author.researchgate | jsonify }},
      "https://github.com/{{ site.author.github }}",
      "https://www.linkedin.com/in/{{ site.author.linkedin }}",
      "https://www.youtube.com/{{ site.author.youtube }}"
    ],
    "subjectOf": [
      { "@type": "WebPage", "name": "Academic CV", "url": "{{ site.url }}/cv/" },
      { "@type": "WebPage", "name": "Research Scientist Resume", "url": "{{ site.url }}/cv/research/" },
      { "@type": "WebPage", "name": "Systems portfolio", "url": "{{ site.url }}/portfolio/" },
      { "@type": "WebPage", "name": "Publications", "url": "{{ site.url }}/publications/" }
    ]
  }
}
</script>
{% endif %}
