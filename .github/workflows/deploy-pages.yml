name: Publish checked website

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate contact information before building
        run: |
          python -m pip install -r tools/requirements-academic-cv.txt
          python -m unittest discover -s tools -p 'test_*cv*.py'
          python -m unittest discover -s tools -p 'test_contact_info.py'
          python tools/build_academic_cv.py --check
          python tools/check_contact_info.py
          python tools/verify_research_artifacts.py
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build Jekyll site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}" --destination _site
        env:
          JEKYLL_ENV: production
      - name: Validate the exact website artifact to be published
        run: python tools/check_contact_info.py --site-dir _site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify public contact details after deployment
        run: |
          python -m pip install -r tools/requirements-academic-cv.txt
          python tools/check_contact_info.py --live-base-url https://cnpcshangbo.github.io
