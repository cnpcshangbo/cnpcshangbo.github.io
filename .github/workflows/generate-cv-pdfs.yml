name: Build CV PDFs

# Builds the academic web CV and PDF from shared data, plus all role PDFs
# from LaTeX sources. Every output passes consistency checks before publishing.

on:
  push:
    branches: [master]
    paths:
      - "cv-tex/**"
      - "_data/cv.yml"
      - "_data/publications.yml"
      - "tools/build_academic_cv.py"
      - "tools/requirements-academic-cv.txt"
      - "_config.yml"
      - "tools/sync_contact_info.py"
      - "tools/check_contact_info.py"
      - "tools/requirements-contact.txt"
      - ".github/workflows/generate-cv-pdfs.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate academic CV and shared contact field
        run: |
          python -m pip install -r tools/requirements-academic-cv.txt
          python tools/sync_contact_info.py
          python tools/build_academic_cv.py

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            latexmk

      - name: Build PDFs
        working-directory: cv-tex
        run: |
          for role in robotics ml fde applied-ai solutions-engineer; do
            echo "::group::Build cv-${role}.pdf"
            latexmk -pdf -interaction=nonstopmode -halt-on-error "cv-${role}.tex"
            echo "::endgroup::"
          done
          ls -lh cv-*.pdf

      - name: Stage PDFs into assets/
        run: |
          mkdir -p assets
          cp cv-tex/cv-robotics.pdf assets/cv-robotics.pdf
          cp cv-tex/cv-ml.pdf       assets/cv-ml.pdf
          cp cv-tex/cv-fde.pdf      assets/cv-fde.pdf
          cp cv-tex/cv-applied-ai.pdf assets/cv-applied-ai.pdf
          cp cv-tex/cv-solutions-engineer.pdf assets/cv-solutions-engineer.pdf
          ls -lh assets/cv-*.pdf

      - name: Verify contact details in every CV, including the academic PDF
        run: |
          python tools/build_academic_cv.py --check
          python tools/check_contact_info.py

      - name: Commit and push if PDFs changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _pages/cv.md assets/cv.pdf cv-tex/contact-info.tex assets/cv-robotics.pdf assets/cv-ml.pdf assets/cv-fde.pdf assets/cv-applied-ai.pdf assets/cv-solutions-engineer.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "ci: rebuild synchronized CV outputs [skip ci]"
          git push origin HEAD:master
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages rebuild
        # GITHUB_TOKEN pushes do not trigger push workflows. Explicitly
        # dispatch the same validated publication path used by human pushes.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-pages.yml --repo "${{ github.repository }}" --ref master

      - name: Upload PDFs as build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: |
            assets/cv*.pdf
            _pages/cv.md
          if-no-files-found: ignore
