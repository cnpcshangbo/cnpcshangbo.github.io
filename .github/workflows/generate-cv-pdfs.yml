name: Build CV PDFs

# Builds the academic CV and Research Scientist resume from shared data.
# Historical role download URLs receive identical copies of the research resume.

on:
  push:
    branches: [master]
    paths:
      - "cv-tex/**"
      - "_data/cv.yml"
      - "_data/research_resume.yml"
      - "tools/build_research_resume.py"
      - "_data/publications.yml"
      - "tools/build_academic_cv.py"
      - "tools/requirements-academic-cv.txt"
      - "_config.yml"
      - "tools/sync_contact_info.py"
      - "tools/check_contact_info.py"
      - "tools/requirements-contact.txt"
      - ".github/workflows/generate-cv-pdfs.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate research resume, academic CV, and shared contact field
        run: |
          python -m pip install -r tools/requirements-academic-cv.txt
          python tools/sync_contact_info.py
          python tools/build_research_resume.py
          python tools/build_academic_cv.py

      - name: Verify contact details in every CV, including the academic PDF
        run: |
          python -m unittest discover -s tools -p 'test_*cv*.py'
          python -m unittest discover -s tools -p 'test_research_resume.py'
          python -m unittest discover -s tools -p 'test_contact_info.py'
          python tools/build_research_resume.py --check
          python tools/build_academic_cv.py --check
          python tools/check_contact_info.py

      - name: Commit and push if PDFs changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _pages/cv-research.md assets/cv-research-scientist.pdf _pages/cv.md assets/cv.pdf cv-tex/contact-info.tex assets/cv-robotics.pdf assets/cv-ml.pdf assets/cv-fde.pdf assets/cv-applied-ai.pdf assets/cv-solutions-engineer.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "ci: rebuild synchronized CV outputs [skip ci]"
          git push origin HEAD:master
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages rebuild
        # GITHUB_TOKEN pushes do not trigger push workflows. Explicitly
        # dispatch the same validated publication path used by human pushes.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-pages.yml --repo "${{ github.repository }}" --ref master

      - name: Upload PDFs as build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: |
            assets/cv*.pdf
            _pages/cv.md
            _pages/cv-research.md
          if-no-files-found: ignore
