# =============================================================================
#  Shared bibliography for /publications/ and the academic web/PDF CV
# =============================================================================
#  Edit bibliography records here and run tools/build_academic_cv.py.
#  The publications page reads this data directly; the academic page and PDF
#  are generated from it. Citation counts carry a separately dated snapshot.
#
#  Each entry under `items:` accepts:
#    title      : full paper title (quote it; titles often contain colons)
#    authors    : verbatim author string; any "B Shang" / "Bo Shang" / "S Bo"
#                 token is auto-bolded as the site owner
#    venue      : journal / conference / repository
#    year       : integer (drives newest-first ordering)
#    type       : journal | conference | meeting | preprint | patent | thesis | report | poster | slides
#    topic      : lidar | streetview | uav-inspection | ndt | control | slam | comms | patent
#                 -> label and default animated thumbnail in _includes/pub-thumb.html
#    illustration: optional paper-specific thumbnail: safety-audit | vru-sensing | robotic-inspection
#    citations  : integer from the dated Scholar snapshot; null if not indexed
#    scholar_id : Google Scholar article ID for a direct record link
#    venue_short: optional compact venue badge
#    note       : optional short highlight, e.g. "Selected for IEEE IROS 2025"
#    featured   : optional visual emphasis when using the pub-card include
#    home       : true to surface in the "Selected publications" section on the homepage (/)
#    links      : optional map — any of { doi, arxiv, ssrn, patent, pdf, slides, code, url }
#                 (a direct Google Scholar button is added when scholar_id is set)
#
#  Add a new paper in its year section, newest first. The bibliography groups
#  by year; the homepage preserves the order of entries marked home: true.
# =============================================================================

