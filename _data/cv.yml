  - title: Research and Engineering Projects
    items:
      - title: Roadside LiDAR and camera perception, CUNY
        date: Nov 2024 - Jul 2026
        bullets:
          - Developed a workflow spanning sensor capture, temporal synchronization, spatial calibration, background subtraction, object segmentation, and road-user detection.
          - Built multi-frame vehicle reconstruction, labeling and quality-assurance workflows, and model evaluation across sites with different beam counts, frame rates, and mounting geometries.
          - Separated site-specific configuration from reusable processing and investigated cross-configuration generalization for traffic monitoring and vulnerable-road-user safety.
      - title: Robotic inspection automation and structural-defect analytics, CCNY
        date: Dec 2022 - Dec 2024
        bullets:
          - Developed CNN-based analysis of cracks, spalling, and stains, with AWS inference and a WebODM-based workflow for 3D reconstruction, localization, visualization, and measurement.
          - Built an iOS application for controlling a climbing inspection robot and integrated human review into inspection-data workflows.
      - title: Bridge Inspection Robot Deployment System (BIRDS), Missouri S&T
        date: 2020 - 2022
        bullets:
          - Developed UAV and clamping-robot components for bridge inspection, including vision-based girder detection, embedded perception, and control of the deployment mechanism.
          - Integrated NVIDIA Jetson, Raspberry Pi, ROS, embedded Linux, cameras, and robot communication; tested autonomous guidance, clamping, and traversal workflows.
      - title: UAV visible, infrared, and hyperspectral sensing
        date: 2020 - 2022
        text: Developed Python and Ubuntu workflows for multimodal infrastructure inspection, sensing, and flight-path planning.
      - title: Robot-assisted underwater acoustic imaging for bridge scour evaluation
        date: 2020 - 2021
        text: Contributed Python/C++, ROS, Arduino, embedded control, and computer-vision components to underwater inspection research.
      - title: Vision-based UAV servoing and fractional-order control
        date: 2015 - 2019
        text: Developed and evaluated visual guidance and control methods using cameras, embedded Linux, Raspberry Pi, and fractional-order controllers.
      - title: SmartCaveDrone and GPS-denied exploration
        date: 2015 - 2017
        text: Contributed RGB-D mapping, visual SLAM, and sense-and-avoid capabilities for UAV exploration and robotic archaeology.
      - title: Early robotics projects
        date: 2010 - 2014
        bullets:
          - '2013-2014: AR.Drone and ROS quadrotor object tracking.'
          - '2012-2013: Indoor LiDAR-equipped quadrotor; 2012: camera-equipped quadrotor.'
          - '2011: Camera-equipped fixed-wing UAV; 2010: infrared line-following smart car.'
