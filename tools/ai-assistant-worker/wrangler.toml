name = "bo-ai-assistant"
main = "src/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
MODEL = "claude-haiku-5-5"
ALLOWED_ORIGINS = "https://cnpcshangbo.github.io,http://localhost:4000,http://127.0.0.1:4000"

# 10 questions per minute per visitor IP
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

# The API key is a secret, set with:  npx wrangler secret put ANTHROPIC_API_KEY
# Never put it in this file or in the website code.
